name: Probe production and version URLs (anonymous, no secrets)
on:
  push:
    branches: [diagnostics/public-site-http-probe]
permissions:
  contents: read
jobs:
  http:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe production, preview and login chain
        shell: bash
        run: |
          python3 - <<'PY'
          import socket, subprocess, pathlib, tempfile, urllib.parse, re
          original='small-cloud-2zs.pages.dev'
          version='7dfa6f88.small-cloud-2zs.pages.dev'
          for host in (original, version):
            try:
              ips={a[4][0] for a in socket.getaddrinfo(host,443)}
              print("DNS:",host,"resolved",len(ips))
            except Exception as e:
              print("DNS:",host,"FAILED",type(e).__name__)
            for path in ('/','/api/diagnose'):
              with tempfile.TemporaryDirectory() as tmp:
                body=str(pathlib.Path(tmp)/"body")
                headers=str(pathlib.Path(tmp)/"headers")
                url='https://'+host+path
                c=subprocess.run(['curl','--max-time','18','--connect-timeout','9',
                  '--silent','--show-error','--output',body,'--dump-header',headers,
                  '--write-out','code=%{http_code};type=%{content_type};size=%{size_download}',
                  url],capture_output=True,text=True)
                raw=pathlib.Path(body).read_bytes() if pathlib.Path(body).exists() else b''
                h=pathlib.Path(headers).read_text(errors='replace') if pathlib.Path(headers).exists() else ''
                loc=re.findall(r'^location:\s*(.*)$',h,re.I|re.M)
                dest=urllib.parse.urlparse(loc[-1].strip()).hostname if loc else '-'
                markers=[marker for marker in ('小手机 · 连接检测','正在打开本地小手机','Cloudflare Access') if marker.encode('utf-8') in raw]
                print('HOST:',host,'PATH:',path,'RESULT:',c.stdout,'EXIT:',c.returncode,'REDIRECT_HOST:',dest,'MARKERS:',markers)
                if c.returncode: print('ERROR:',c.stderr[:140])
          with tempfile.TemporaryDirectory() as tmp:
            file=str(pathlib.Path(tmp)/'body')
            p=subprocess.run(['curl','--location','--max-redirs','6','--max-time','20',
              '--silent','--show-error','--output',file,
              '--write-out','code=%{http_code};type=%{content_type};url=%{url_effective};size=%{size_download}',
              'https://'+original+'/'],capture_output=True,text=True)
            url=re.search(r'url=([^;]*)',p.stdout)
            dest=urllib.parse.urlparse(url.group(1)).hostname if url else '-'
            code=re.search(r'code=(\d+)',p.stdout)
            body=pathlib.Path(file).read_bytes() if pathlib.Path(file).exists() else b''
            title=re.search(rb'<title[^>]*>([^<]{0,120})</title>',body,re.I)
            t=title.group(1).decode('utf8','replace') if title else '-'
            print('FOLLOW_LOGIN: status=',code.group(1) if code else '?','hostname=',dest,'title=',t,'exit=',p.returncode)
          PY
