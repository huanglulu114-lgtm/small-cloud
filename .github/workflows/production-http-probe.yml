              headers=str(pathlib.Path(td)/'headers')
              body=str(pathlib.Path(td)/'body')
              p=subprocess.run(['curl','--max-time','15','--connect-timeout','8',
                '--silent','--show-error','--output',body,'--dump-header',headers,
                '--write-out','STATUS=%{http_code};TYPE=%{content_type};BYTES=%{size_download}',
                'https://'+host+path],capture_output=True,text=True)
              h=pathlib.Path(headers).read_text(errors='replace') if pathlib.Path(headers).exists() else ''
              d=pathlib.Path(body).read_bytes() if pathlib.Path(body).exists() else b''
              location=re.findall(r'^location:\\s*(.*)        shell: bash
        run: |
          python3 - <<'PY'
          import subprocess,tempfile,pathlib,urllib.parse,re
          target="https://small-cloud-2zs.pages.dev/"
          with tempfile.TemporaryDirectory() as td:
            headers=str(pathlib.Path(td)/'headers')
            body=str(pathlib.Path(td)/'body')
            p=subprocess.run([
